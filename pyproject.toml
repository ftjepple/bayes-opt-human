[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesopt-human"
version = "0.1.0"
description = "Bayesian Black-Box Optimization with Human-in-the-Loop"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "gpytorch>=1.11",
    "botorch>=0.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ui = [
    "panel>=1.0",
]
notebooks = [
    # ipywidgets silences the tqdm.auto "IProgress not found" warning that
    # torch/botorch trigger when running inside a Jupyter kernel, and lets
    # progress bars render properly in the notebook.
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["bayesopt_human*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
